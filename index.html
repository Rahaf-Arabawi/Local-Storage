<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo-List</title>
    <link rel="stylesheet" href="style1.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>
    <div class="fluid-container p-4">
        <p id="welcomeMessage"></p>
        <!-- <h1>ToDo-List </h1> -->
        <div class="mb-3">
            <input id="taskinput" type="text" class="form-control mb-4" placeholder="enter new task">
            <button id="addTask" class="btn btn-primary">Add new task</button>
        </div>
        <div>
            <ul id="taskList">
            </ul>
            <button class="btn btn-dark" id="selectAll">Select all</button>

            <button class="btn btn-danger" id="deleteAllBtn" disabled>Delete All Selected Task</button>
        </div>
    </div>
   
  <script src="main1.js"></script>
</body>
</html>
